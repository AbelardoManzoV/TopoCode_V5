<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TopoCode | Agencia de Desarrollo de Software</title>
    <meta
      name="description"
      content="TopoCode es una mini agencia de desarrollo de software enfocada en negocios locales. Creamos páginas web, tiendas en línea, apps y sistemas a la medida."
    />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2b303a" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        const ua = navigator.userAgent;
        if (/iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
          document.documentElement.classList.add("ios");
        }
        const theme = localStorage.getItem("topocode-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (!theme && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.add("light");
        }

        const language = localStorage.getItem("topocode-language");
        const browserLang = navigator.language?.split("-")[0];
        document.documentElement.lang =
          language || (browserLang === "en" ? "en" : "es");
      })();
    </script>
    <link rel="canonical" href="https://topocode.mx/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://topocode.mx/" />
    <meta property="og:title" content="TopoCode | Agencia de Desarrollo de Software" />
    <meta
      property="og:description"
      content="Creamos páginas web, apps y soluciones digitales para negocios que quieren crecer."
    />
    <meta property="og:image" content="https://topocode.mx/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TopoCode | Agencia de Desarrollo de Software" />
    <meta
      name="twitter:description"
      content="Creamos páginas web, apps y soluciones digitales para negocios que quieren crecer."
    />
    <meta name="twitter:image" content="https://topocode.mx/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
